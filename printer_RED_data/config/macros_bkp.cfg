[gcode_macro SALVAR_CONFIGURACAO]
description: Salva as alteracoes atuais e reinicia o Klipper
gcode:
    SAVE_CONFIG ; Somente para adicionar o botão de save_config à página inicial.


[gcode_arcs] # Certifique-se de ter isso no seu printer.cfg

[gcode_macro TESTE_RANGE_PARAFUSOS]
description: Testa os 4 parafusos com mesa aquecida e exibe resumo de 4 classes
variable_coords_x: [50, 200, 200, 50]
variable_coords_y: [45, 45, 200, 200]
variable_nomes: ["Frontal Esquerdo", "Frontal Direito", "Traseiro Direito", "Traseiro Esquerdo"]
variable_ponto_atual: 0
variable_amostras_max: 10
variable_amostra_atual: 0
variable_z_min: 999.0
variable_z_max: -999.0
variable_r0: ""
variable_r1: ""
variable_r2: ""
variable_r3: ""
gcode:
    RESPOND MSG="Aquecendo a mesa a 50°C..."
    M190 S50 # Esquenta e aguarda atingir 50°C
    
    {% if not 'xyz' in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    SET_GCODE_VARIABLE MACRO=TESTE_RANGE_PARAFUSOS VARIABLE=ponto_atual VALUE=0
    _TESTE_MOVE_PONTO

[gcode_macro _TESTE_MOVE_PONTO]
gcode:
    {% set m = printer["gcode_macro TESTE_RANGE_PARAFUSOS"] %}
    {% if m.ponto_atual < 4 %}
        {% set x = m.coords_x[m.ponto_atual] %}
        {% set y = m.coords_y[m.ponto_atual] %}
        {% set nome = m.nomes[m.ponto_atual] %}
        
        RESPOND MSG="Iniciando leituras: {nome}"
        G90
        G1 Z10 F1200
        G1 X{x} Y{y} F13200
        
        SET_GCODE_VARIABLE MACRO=TESTE_RANGE_PARAFUSOS VARIABLE=amostra_atual VALUE=0
        SET_GCODE_VARIABLE MACRO=TESTE_RANGE_PARAFUSOS VARIABLE=z_min VALUE=999.0
        SET_GCODE_VARIABLE MACRO=TESTE_RANGE_PARAFUSOS VARIABLE=z_max VALUE=-999.0
        
        UPDATE_DELAYED_GCODE ID=_LOOP_PROBE DURATION=0.1
    {% else %}
        # Subida de segurança de 10mm no final
        G91
        G1 Z10 F1200
        G90
        
        RESPOND MSG="========== RESUMO FINAL =========="
        RESPOND MSG="{m.r0}"
        RESPOND MSG="{m.r1}"
        RESPOND MSG="{m.r2}"
        RESPOND MSG="{m.r3}"
        RESPOND MSG="=================================="
    {% endif %}

[delayed_gcode _LOOP_PROBE]
gcode:
    {% set m = printer["gcode_macro TESTE_RANGE_PARAFUSOS"] %}
    {% if m.amostra_atual < m.amostras_max %}
        G90
        G1 Z10 F1200
        PROBE
        UPDATE_DELAYED_GCODE ID=_REGISTRA_PROBE DURATION=0.1
    {% else %}
        _TESTE_CALCULA
    {% endif %}

[delayed_gcode _REGISTRA_PROBE]
gcode:
    {% set m = printer["gcode_macro TESTE_RANGE_PARAFUSOS"] %}
    {% set z = printer.probe.last_z_result %}
    
    {% if z < m.z_min %}
        SET_GCODE_VARIABLE MACRO=TESTE_RANGE_PARAFUSOS VARIABLE=z_min VALUE={z}
    {% endif %}
    
    {% if z > m.z_max %}
        SET_GCODE_VARIABLE MACRO=TESTE_RANGE_PARAFUSOS VARIABLE=z_max VALUE={z}
    {% endif %}
    
    SET_GCODE_VARIABLE MACRO=TESTE_RANGE_PARAFUSOS VARIABLE=amostra_atual VALUE={m.amostra_atual + 1}
    UPDATE_DELAYED_GCODE ID=_LOOP_PROBE DURATION=0.1

[gcode_macro _TESTE_CALCULA]
gcode:
    {% set m = printer["gcode_macro TESTE_RANGE_PARAFUSOS"] %}
    {% set range = (m.z_max - m.z_min)|round(4) %}
    {% set nome = m.nomes[m.ponto_atual] %}
    
    # Aspas simples removidas das tags de cor para não quebrar a variável
    {% if range <= 0.010 %}
        {% set status = "<font color=green>ÓTIMO</font>" %}
    {% elif range <= 0.025 %}
        {% set status = "<font color=yellow>BOM</font>" %}
    {% elif range <= 0.050 %}
        {% set status = "<font color=orange>MEDIANO</font>" %}
    {% else %}
        {% set status = "<font color=red>RUIM</font>" %}
    {% endif %}
    
    {% set texto_resultado = nome ~ ": " ~ range ~ "mm - Status: " ~ status %}
    
    {% if m.ponto_atual == 0 %}
        SET_GCODE_VARIABLE MACRO=TESTE_RANGE_PARAFUSOS VARIABLE=r0 VALUE="'{texto_resultado}'"
    {% elif m.ponto_atual == 1 %}
        SET_GCODE_VARIABLE MACRO=TESTE_RANGE_PARAFUSOS VARIABLE=r1 VALUE="'{texto_resultado}'"
    {% elif m.ponto_atual == 2 %}
        SET_GCODE_VARIABLE MACRO=TESTE_RANGE_PARAFUSOS VARIABLE=r2 VALUE="'{texto_resultado}'"
    {% elif m.ponto_atual == 3 %}
        SET_GCODE_VARIABLE MACRO=TESTE_RANGE_PARAFUSOS VARIABLE=r3 VALUE="'{texto_resultado}'"
    {% endif %}
    
    M117 {nome}: {range}
    
    SET_GCODE_VARIABLE MACRO=TESTE_RANGE_PARAFUSOS VARIABLE=ponto_atual VALUE={m.ponto_atual + 1}
    _TESTE_MOVE_PONTO
    
[gcode_macro ALINHAR_PARAFUSOS]
description: Aquece a mesa, faz o home de todos os eixos e inicia o cálculo dos parafusos.
gcode:
    M117 Aquecendo a mesa...
    M140 S50 ; Define a temperatura sem travar a execucao
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM=50 ; Avanca instantaneamente se ja estiver em 50C ou mais
    
    M117 Fazendo Home...
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    
    M117 Calculando parafusos...
    SCREWS_TILT_CALCULATE
    
    # Subida de segurança de 10mm no final
    G91
    G1 Z10 F1200
    G90
    M117 Pronto.


[gcode_macro TESTE_VELOCIDADE_FISICA]
gcode:
    # 1. Configurações de Entrada (Valores padrões atualizados para os novos limites)
    {% set V_INICIAL = params.V_INICIAL|default(200)|int %}      
    {% set V_FINAL = params.V_FINAL|default(240)|int %}         # Limitado para 240mm/s
    {% set A_INICIAL = params.A_INICIAL|default(2500)|int %}     
    {% set A_FINAL = params.A_FINAL|default(4000)|int %}        # Limitado para 4000mm/s²
    {% set PASSOS = params.PASSOS|default(4)|int %}              
    {% set SCV = params.SCV|default(15)|int %} 

    # Limites da área útil da Ender 3 V3 SE
    {% set X_MIN = 20 %}
    {% set X_MAX = 200 %}
    {% set Y_MIN = 20 %}
    {% set Y_MAX = 200 %}
    {% set X_MID = 110 %}
    {% set Y_MID = 110 %}
    {% set RAIO = 50 %} 

    # Altura inicial de segurança
    {% set Z_START = 10.0 %}

    # Cálculo automático dos incrementos
    {% set passos_ajustados = PASSOS - 1 if PASSOS > 1 else 1 %}
    {% set V_INCREMENTO = (V_FINAL - V_INICIAL) / passos_ajustados %}
    {% set A_INCREMENTO = (A_FINAL - A_INICIAL) / passos_ajustados %}

    # 2. Preparação da Máquina
    G28 ; Home em todos os eixos
    G90 ; Coordenadas absolutas
    M83 ; Extrusora em modo relativo
    
    G1 Z{Z_START} F1200
    
    # 3. Loop de Execução
    {% for i in range(PASSOS) %}
        {% set v_atual = (V_INICIAL + (i * V_INCREMENTO))|int %}
        {% set a_atual = (A_INICIAL + (i * A_INCREMENTO))|int %}
        {% set z_atual = Z_START + (i * 0.2) %}
        {% set f_atual = v_atual * 60 %} 

        # Mensagens no terminal
        M117 Z:{z_atual} V:{v_atual} A:{a_atual}
        RESPOND MSG="Andar {i+1}/{PASSOS}: Z={z_atual}mm | Vel={v_atual}mm/s | Accel={a_atual}mm/s² | SCV={SCV}"
        
        # Aplica os limites dinâmicos e eleva o SCV para transições fluidas
        SET_VELOCITY_LIMIT VELOCITY={v_atual} ACCEL={a_atual} ACCEL_TO_DECEL={a_atual} SQUARE_CORNER_VELOCITY={SCV}

        # Posiciona em Z para o passo atual
        G1 Z{z_atual} F1200

        # --- PADRÃO 1: O "X" ---
        G1 X{X_MIN} Y{Y_MIN} F{f_atual}
        G1 X{X_MAX} Y{Y_MAX} F{f_atual}
        G1 X{X_MIN} Y{Y_MAX} F{f_atual}
        G1 X{X_MAX} Y{Y_MIN} F{f_atual}

        # Transição suave para o Quadrado (anda pela borda inferior)
        G1 X{X_MIN} Y{Y_MIN} F{f_atual}

        # --- PADRÃO 2: QUADRADO ---
        G1 X{X_MAX} Y{Y_MIN} F{f_atual}
        G1 X{X_MAX} Y{Y_MAX} F{f_atual}
        G1 X{X_MIN} Y{Y_MAX} F{f_atual}
        G1 X{X_MIN} Y{Y_MIN} F{f_atual}

        # Transição suave para o Círculo (entra na curva tangenciando)
        G1 X{X_MID + RAIO} Y{Y_MID} F{f_atual}

        # --- PADRÃO 3: CÍRCULO VIA ARCOS NATIVOS (G2) ---
        G2 X{X_MID - RAIO} Y{Y_MID} I-{RAIO} J0 F{f_atual}
        G2 X{X_MID + RAIO} Y{Y_MID} I{RAIO} J0 F{f_atual}

    {% endfor %}

    # 4. Finalização Segura
    G1 Z{Z_START + (PASSOS * 0.2) + 5} F1200 
    G1 X0 Y220 F3000                         
    M117 Fim do Teste
    RESPOND MSG="Teste concluido com movimentos suavizados!"

[gcode_macro LIMPEZA_NOZZLE_ESCOVA]
gcode:
    {% set max_accel = printer.configfile.settings.printer.max_accel %}
    
    # Garante temperatura de 180°C e aguarda estabilizar
    M117 Aquecendo bico para 190C...
    M109 S190

    {% if "xyz" not in printer.toolhead.homed_axes %}
        M117 Fazendo homing...
        G28
    {% endif %}

    SET_VELOCITY_LIMIT ACCEL=3600 ACCEL_TO_DECEL=1800
    M117 Limpando bico na escova...
    G90
    G1 Z10 F1200
    G1 X86 Y-21.8 F13200              ; Ponto Inicial: Anterior Direito (AD)
    G1 Z2 F1200
    # Faixa 1 (Mais Distante: Y-21.8)
    G1 X52 F13200                     ; Varre até Anterior Esquerdo (AE)
    G1 X66 F13200
    G1 X52 F13200
    G1 X66 F13200
    G1 X52 F13200
    # Faixa 2 (Intermediária Distante: Y-20.3)
    G1 Y-20.3 F13200
    G1 X86 F13200
    G1 X72 F13200
    G1 X86 F13200
    G1 X72 F13200
    G1 X86 F13200
    # Faixa 3 (Intermediária Próxima: Y-18.7)
    G1 Y-18.7 F13200
    G1 X52 F13200
    G1 X66 F13200
    G1 X52 F13200
    G1 X66 F13200
    G1 X52 F13200
    # Faixa 4 (Mais Perto: Y-17.2)
    G1 Y-17.2 F13200                  
    G1 X86 F13200                     ; Varre até Posterior Direito (PD)
    G1 X72 F13200
    G1 X86 F13200
    # --- Desengate Rápido e Saída ---
    G1 Y-14.0 F13200                  ; Afasta do bico para frente
    G1 X45 Z10 F13200                  ; Sobe e sai pela esquerda
    G4 P200
    SET_VELOCITY_LIMIT ACCEL={max_accel}
    M117 Limpeza concluída!

[gcode_macro M600]
description: Troca de filamento com bipes e popup na tela
gcode:
    SAVE_GCODE_STATE NAME=M600_state
    PAUSE_BASE
    
    G91                ; Muda para o modo de coordenadas relativo
    G1 E-2 F2700       ; Retrai 2mm para evitar vazamento durante o movimento
    G1 Z10 F3000       ; Sobe o eixo Z em 10mm (movimento relativo)
    G90                ; Muda para o modo de coordenadas absoluto
    G1 X-15 Y-8 Z2 F6000     ; Move para X0 e Y0 (movimento absoluto)
    
    {action_respond_info("Aguardando troca de filamento")}
    
    # --- Criação do Popup Interativo na Interface ---
    RESPOND TYPE=command MSG="action:prompt_begin Troca de Filamento"
    RESPOND TYPE=command MSG="action:prompt_text Insira o novo filamento e limpe o bico antes de continuar."
    RESPOND TYPE=command MSG="action:prompt_footer_button RETOMAR IMPRESSÃO|RETOMAR_IMPRESSAO|primary"
    RESPOND TYPE=command MSG="action:prompt_show"
    
    # Inicia o loop de bipes
    UPDATE_DELAYED_GCODE ID=ALERT_BEEP_LOOP DURATION=1

[gcode_macro RETOMAR_IMPRESSAO]
description: Retoma a impressão realizando purga de 30mm
gcode:
    # 1. Fecha o popup imediatamente da tela
    RESPOND TYPE=command MSG="action:prompt_end"
    
    # 2. Para o loop de bipes
    UPDATE_DELAYED_GCODE ID=ALERT_BEEP_LOOP DURATION=0
    
    # 3. Purga 30mm de filamento para limpar o bico
    {action_respond_info("RETOMAR_IMPRESSAO: Purgando 30mm de filamento...")}
    G91
    G1 E30 F240    # Purga lenta
    G1 E-0.8 F2400 # Retração antes do retorno    
    G90

    # 4. Restaura a posição da cabeça exatamente onde parou
    RESTORE_GCODE_STATE NAME=M600_state MOVE=1 MOVE_SPEED=100
    
    
    
    RESUME_BASE

[delayed_gcode ALERT_BEEP_LOOP]
gcode:
    M300 P50 S1000
    G4 P100
    M300 P50 S1000
    G4 P100
    M300 P50 S1000
    UPDATE_DELAYED_GCODE ID=ALERT_BEEP_LOOP DURATION=3


[gcode_macro EXTRUSAO_FILAMENTO]
description: Prepara a impressora, bipa e abre popup para purga estilo adaptive line.
gcode:
    # 1. Homing seguro
    {% if printer.toolhead.homed_axes != "xyz" %}
        {action_respond_info("Homing pendente. Iniciando G28...")}
        G28
    {% endif %}

    # 2. Levanta Z para movimento seguro
    G91
    G1 Z10 F1500
    G90

    # 3. Mover para a origem (X0 Y0) em Z alto para aguardar aquecimento
    G1 X0 Y0 Z10 F6000  

    # 4. Aquecimento (espera atingir 200°C)
    {action_respond_info("Aquecendo bico para 200°C...")}
    M109 S200 

    # 5. Bipes de alerta
    M300 S440 P100
    G4 P100
    M300 S440 P100
    G4 P100
    M300 S440 P100

    # 6. Popup no Fluidd/Mainsail
    RESPOND TYPE=command MSG="action:prompt_begin Purga de Filamento (Estilo Adaptive)"
    RESPOND TYPE=command MSG="action:prompt_text Bico aquecido. Clique abaixo para executar a linha de purga em X0 Y0."
    RESPOND TYPE=command MSG="action:prompt_footer_button PURGAR 40MM|_EXECUTAR_PURGA|primary"
    RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _EXECUTAR_PURGA]
description: Executa a linha de purga adaptativa a partir de X0 Y0
# Declaração correta de variáveis de macro do Klipper (fora do bloco gcode)
variable_purge_height: 0.8  
variable_tip_distance: 4    
variable_purge_amount: 40   
variable_flow_rate: 12      
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"

    {% if printer.extruder.temperature >= 195 %}
        {% set travel_speed = printer.toolhead.max_velocity * 60 %}
        {% set purge_move_speed = (flow_rate / 5.0) * 60 | float %}
        {% set RETRACT = 'G10' if printer.firmware_retraction is defined else 'G1 E-0.5 F2100' %}
        {% set UNRETRACT = 'G11' if printer.firmware_retraction is defined else 'G1 E0.5 F2100' %}

        SAVE_GCODE_STATE NAME=prepurge_state

        G92 E0
        G90
        
        # Posiciona em X0 Y0 na altura de purga (0.8mm)
        G0 X0 Y0 F{travel_speed}
        G0 Z{purge_height}
        
        M83 ; Extrusão relativa
        
        # Preenche a ponta do bico (unretract/prime inicial)
        G1 E{tip_distance} F{purge_move_speed}

        # Faz o trajeto em X (de X0 até X40) extruindo 40mm de filamento
        G1 X{purge_amount} E{purge_amount} F{purge_move_speed}
        
        # Retração rápida no final da linha
        {RETRACT}
        
        # Movimento de "wipe" rápido para cortar o fio de plástico
        G0 X{purge_amount + 10} F{travel_speed}
        
        # Eleva o Z para afastar da fita
        G0 Z{purge_height * 4} F{travel_speed}
        {UNRETRACT}
        
        G92 E0
        M82 ; Retorna para extrusão absoluta

        RESTORE_GCODE_STATE NAME=prepurge_state
        {action_respond_info("Linha de purga concluida com sucesso!")}
    {% else %}
        {action_respond_info("Erro: Temperatura abaixo de 195°C. Abortado por seguranca.")}
    {% endif %}

[gcode_macro BED_THERMAL_SATURATION]
description: Expanda a seta ao lado para digitar a temperatura alvo (TARGET)
gcode:
    # Captura o valor digitado ou usa 50 como padrão. Calcula o pico (+10).
    {% set target = params.TARGET|default(50)|float %}
    {% set overshoot = target + 10 %}
    {% set wait = 2 %} # Tempo de espera em minutos para cada etapa

    RESPOND MSG="Iniciando saturação térmica. Aquecendo para {overshoot}°C..."
    M190 S{overshoot}
    
    RESPOND MSG="Temperatura de pico atingida. Mantendo por {wait} minutos..."
    G4 P{wait * 60000}
    
    RESPOND MSG="Resfriando para a temperatura alvo de {target}°C..."
    M190 S{target}
    
    RESPOND MSG="Temperatura alvo atingida. Estabilizando por {wait} minutos..."
    G4 P{wait * 60000}
    
    RESPOND MSG="Saturação térmica concluída!"

[gcode_macro MODO_STANDBY]
description: Desliga tudo e coloca a impressora em standby
gcode:
  M104 S0                               ; Desliga o hotend
  M140 S0                               ; Desliga a mesa
  M107                                  ; Desliga a ventoinha do material
  M84                                   ; Desliga os motores de passo
  TURN_OFF_HEATERS                      ; Garante o desligamento de aquecedores
  SET_PIN PIN=beeper VALUE=1            ; Liga o beep
  G4 P100                               ; Aguarda 100ms
  SET_PIN PIN=beeper VALUE=0            ; Desliga o beep
  {action_respond_info("Impressora em Standby (Tudo desligado)")}

[gcode_macro SALVAR_VARIAVEIS]
description: Executa o salvamento de todas as variaveis modulares
gcode:
    _SALVAR_PA
    _SALVAR_RETRACTION
    _SALVAR_IS
    M118 Todas as variaveis foram salvas!

[gcode_macro _CARREGAR_VARIAVEIS]
description: Carrega todas as variaveis modulares
gcode:
    _CARREGAR_PA
    _CARREGAR_RETRACTION
    _CARREGAR_IS
    M118 Todas as variaveis foram carregadas!

[gcode_macro _SALVAR_PA]
description: Salva o valor atual do Pressure Advance na memoria
gcode:
    {% set pa = printer.extruder.pressure_advance %}
    {% set st = printer.extruder.smooth_time %}
    SAVE_VARIABLE VARIABLE=saved_pa VALUE={pa}
    SAVE_VARIABLE VARIABLE=saved_st VALUE={st}
    M118 PA Salvo: {pa} | Smooth Time: {st}

[gcode_macro _CARREGAR_PA]
description: Aplica o Pressure Advance salvo
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set pa = svv.saved_pa | default(0.0) %}
    {% set st = svv.saved_st | default(0.040) %}
    SET_PRESSURE_ADVANCE ADVANCE={pa} SMOOTH_TIME={st}
    M118 PA Carregado: {pa}

[gcode_macro _SALVAR_RETRACTION]
description: Salva os parametros atuais de retracao
gcode:
    {% set rl = printer.firmware_retraction.retract_length %}
    {% set rs = printer.firmware_retraction.retract_speed %}
    {% set uel = printer.firmware_retraction.unretract_extra_length %}
    {% set us = printer.firmware_retraction.unretract_speed %}
    SAVE_VARIABLE VARIABLE=saved_retract_length VALUE={rl}
    SAVE_VARIABLE VARIABLE=saved_retract_speed VALUE={rs}
    SAVE_VARIABLE VARIABLE=saved_unretract_extra VALUE={uel}
    SAVE_VARIABLE VARIABLE=saved_unretract_speed VALUE={us}
    M118 Retracao Salva: {rl}mm a {rs}mm/s

[gcode_macro _CARREGAR_RETRACTION]
description: Carrega os parametros de retracao salvos
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set rl = svv.saved_retract_length | default(0.8) %}
    {% set rs = svv.saved_retract_speed | default(40.0) %}
    {% set uel = svv.saved_unretract_extra | default(0.0) %}
    {% set us = svv.saved_unretract_speed | default(40.0) %}
    SET_RETRACTION RETRACT_LENGTH={rl} RETRACT_SPEED={rs} UNRETRACT_EXTRA_LENGTH={uel} UNRETRACT_SPEED={us}
    M118 Retracao Carregada: {rl}mm a {rs}mm/s

[gcode_macro SET_INPUT_SHAPER_FREQ]
description: Define as frequencias e damping do Input Shaper manualmente (MZV fixo)
variable_last_freq_x: 40.0
variable_last_freq_y: 40.0
variable_last_damp_x: 0.1
variable_last_damp_y: 0.1
variable_last_type_x: 'mzv'
variable_last_type_y: 'mzv'
gcode:
  {% set freq_x = params.FREQ_X|default(40.0)|float %}
  {% set freq_y = params.FREQ_Y|default(40.0)|float %}
  {% set damp_x = params.DAMPING_X|default(0.1)|float %}
  {% set damp_y = params.DAMPING_Y|default(0.1)|float %}

  SET_INPUT_SHAPER SHAPER_TYPE_X=mzv SHAPER_TYPE_Y=mzv
  SET_INPUT_SHAPER SHAPER_FREQ_X={freq_x} SHAPER_FREQ_Y={freq_y}
  SET_INPUT_SHAPER DAMPING_RATIO_X={damp_x} DAMPING_RATIO_Y={damp_y}

  # Atualiza o estado na memoria da macro para o _SALVAR_IS ler
  SET_GCODE_VARIABLE MACRO=SET_INPUT_SHAPER_FREQ VARIABLE=last_freq_x VALUE={freq_x}
  SET_GCODE_VARIABLE MACRO=SET_INPUT_SHAPER_FREQ VARIABLE=last_freq_y VALUE={freq_y}
  SET_GCODE_VARIABLE MACRO=SET_INPUT_SHAPER_FREQ VARIABLE=last_damp_x VALUE={damp_x}
  SET_GCODE_VARIABLE MACRO=SET_INPUT_SHAPER_FREQ VARIABLE=last_damp_y VALUE={damp_y}

  M118 IS Aplicado (MZV): X={freq_x}Hz (Damp: {damp_x}) | Y={freq_y}Hz (Damp: {damp_y})


[gcode_macro _SALVAR_IS]
description: Salva os parametros atuais do Input Shaper na memoria
gcode:
    {% if 'input_shaper' in printer.configfile.settings %}
        {% set is_macro = printer["gcode_macro SET_INPUT_SHAPER_FREQ"] %}
        {% set is_x = is_macro.last_freq_x %}
        {% set is_y = is_macro.last_freq_y %}
        {% set damp_x = is_macro.last_damp_x %}
        {% set damp_y = is_macro.last_damp_y %}
        {% set type_x = is_macro.last_type_x %}
        {% set type_y = is_macro.last_type_y %}

        SAVE_VARIABLE VARIABLE=saved_is_freq_x VALUE={is_x}
        SAVE_VARIABLE VARIABLE=saved_is_freq_y VALUE={is_y}
        SAVE_VARIABLE VARIABLE=saved_is_type_x VALUE='"{type_x}"'
        SAVE_VARIABLE VARIABLE=saved_is_type_y VALUE='"{type_y}"'
        SAVE_VARIABLE VARIABLE=saved_is_damp_x VALUE={damp_x}
        SAVE_VARIABLE VARIABLE=saved_is_damp_y VALUE={damp_y}

        M118 IS Salvo: X={is_x}Hz ({type_x}, Damp:{damp_x}) | Y={is_y}Hz ({type_y}, Damp:{damp_y})
    {% else %}
        M118 AVISO: Bloco [input_shaper] ausente no printer.cfg. Impossivel salvar.
    {% endif %}


[gcode_macro _CARREGAR_IS]
description: Aplica os parametros salvos do Input Shaper
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set is_x = svv.saved_is_freq_x | default(40.0) %}
    {% set is_y = svv.saved_is_freq_y | default(40.0) %}
    {% set type_x = svv.saved_is_type_x | default('mzv') %}
    {% set type_y = svv.saved_is_type_y | default('mzv') %}
    {% set damp_x = svv.saved_is_damp_x | default(0.1) %}
    {% set damp_y = svv.saved_is_damp_y | default(0.1) %}

    SET_INPUT_SHAPER SHAPER_FREQ_X={is_x} SHAPER_FREQ_Y={is_y} SHAPER_TYPE_X={type_x} SHAPER_TYPE_Y={type_y} DAMPING_RATIO_X={damp_x} DAMPING_RATIO_Y={damp_y}

    # Sincroniza o estado interno da macro ao carregar
    SET_GCODE_VARIABLE MACRO=SET_INPUT_SHAPER_FREQ VARIABLE=last_freq_x VALUE={is_x}
    SET_GCODE_VARIABLE MACRO=SET_INPUT_SHAPER_FREQ VARIABLE=last_freq_y VALUE={is_y}
    SET_GCODE_VARIABLE MACRO=SET_INPUT_SHAPER_FREQ VARIABLE=last_damp_x VALUE={damp_x}
    SET_GCODE_VARIABLE MACRO=SET_INPUT_SHAPER_FREQ VARIABLE=last_damp_y VALUE={damp_y}

    M118 IS Carregado: X={is_x}Hz ({type_x}, Damp:{damp_x}) | Y={is_y}Hz ({type_y}, Damp:{damp_y})