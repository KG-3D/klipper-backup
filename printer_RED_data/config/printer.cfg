[mcu]
serial: /dev/serial/by-path/platform-30120000.usb-usb-0:1:1.0-port0
baud: 500000
restart_method: command

[extruder]
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
rotation_distance: 7.900
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_cross_section: 5
max_extrude_only_distance: 500
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: 0
max_temp: 260

#[include s2dw.cfg]

[gcode_macro _WLED_INSTANCE]
variable_segment: 0
gcode:

[virtual_sdcard]
path: /home/kayogaldino/printer_RED_data/gcodes
on_error_gcode: CANCEL_PRINT

[save_variables]
filename: /home/kayogaldino/printer_RED_data/config/variables.cfg

[include common_settings.cfg]

