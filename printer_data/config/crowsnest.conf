[crowsnest]
log_path: ~/printer_data/logs/crowsnest.log
log_level: quiet
delete_log: true

[cam red_cam]
mode: ustreamer
port: 8081
device: /dev/v4l/by-path/platform-30080000.usb-usb-0:1:1.0-video-index0
resolution: 352x288
max_fps: 30
custom_flags: --host 0.0.0.0 -m mjpeg

[cam green_cam]
mode: ustreamer
port: 8082
device: /dev/v4l/by-path/platform-300c0000.usb-usb-0:1:1.0-video-index0
resolution: 352x288
max_fps: 30
custom_flags: --host 0.0.0.0 -m mjpeg
