[gcode_macro TESTE_PROBE_ACCURACY]
description: Testa acurácia do probe com múltiplas leituras por amostra e análise estatística
variable_speed: 16.0
variable_lift: 20.0
variable_retract: 1.5
variable_amostras_max: 10
variable_amostra_atual: 0
variable_probes_per_sample: 2
variable_sub_probe_atual: 0
variable_sub_sum_z: 0.0
variable_z_min: 999.0
variable_z_max: -999.0
variable_sum_z: 0.0
variable_sum_z2: 0.0
gcode:
    {% set speed = params.SPEED|default(16.0)|float %}
    {% set samples = params.SAMPLES|default(10)|int %}
    {% set probes = params.PROBES|default(2)|int %}
    {% set retract = params.RETRACT|default(1.5)|float %}
    {% set lift = params.LIFT|default(20.0)|float %}

    SET_GCODE_VARIABLE MACRO=TESTE_PROBE_ACCURACY VARIABLE=speed VALUE={speed}
    SET_GCODE_VARIABLE MACRO=TESTE_PROBE_ACCURACY VARIABLE=lift VALUE={lift}
    SET_GCODE_VARIABLE MACRO=TESTE_PROBE_ACCURACY VARIABLE=retract VALUE={retract}
    SET_GCODE_VARIABLE MACRO=TESTE_PROBE_ACCURACY VARIABLE=amostras_max VALUE={samples}
    SET_GCODE_VARIABLE MACRO=TESTE_PROBE_ACCURACY VARIABLE=amostra_atual VALUE=0
    SET_GCODE_VARIABLE MACRO=TESTE_PROBE_ACCURACY VARIABLE=probes_per_sample VALUE={probes}
    SET_GCODE_VARIABLE MACRO=TESTE_PROBE_ACCURACY VARIABLE=sub_probe_atual VALUE=0
    SET_GCODE_VARIABLE MACRO=TESTE_PROBE_ACCURACY VARIABLE=sub_sum_z VALUE=0.0
    SET_GCODE_VARIABLE MACRO=TESTE_PROBE_ACCURACY VARIABLE=z_min VALUE=999.0
    SET_GCODE_VARIABLE MACRO=TESTE_PROBE_ACCURACY VARIABLE=z_max VALUE=-999.0
    SET_GCODE_VARIABLE MACRO=TESTE_PROBE_ACCURACY VARIABLE=sum_z VALUE=0.0
    SET_GCODE_VARIABLE MACRO=TESTE_PROBE_ACCURACY VARIABLE=sum_z2 VALUE=0.0

    {% if "xyz" not in printer.toolhead.homed_axes %}
        M117 Fazendo homing...
        G28
    {% endif %}

    G90
    G1 Z10 F1200
    G1 X110 Y110 F6000

    M117 Testando {speed}mm/s ({samples}x com {probes} probes)...
    {action_respond_info("Iniciando Análise: Speed=" ~ speed ~ "mm/s | Amostras=" ~ samples ~ " (" ~ probes ~ " probes/amostra) | Retract=" ~ retract ~ "mm | Lift=" ~ lift ~ "mm/s")}

    UPDATE_DELAYED_GCODE ID=_LOOP_PROBE_ACCURACY DURATION=0.1

[delayed_gcode _LOOP_PROBE_ACCURACY]
gcode:
    {% set m = printer["gcode_macro TESTE_PROBE_ACCURACY"] %}
    {% if m.amostra_atual < m.amostras_max %}
        PROBE PROBE_SPEED={m.speed}
        UPDATE_DELAYED_GCODE ID=_REGISTRA_PROBE_ACCURACY DURATION=0.05
    {% else %}
        _CALCULA_PROBE_ACCURACY
    {% endif %}

[delayed_gcode _REGISTRA_PROBE_ACCURACY]
gcode:
    {% set m = printer["gcode_macro TESTE_PROBE_ACCURACY"] %}
    {% set z = printer.probe.last_z_result|float %}
    {% set lift_feedrate = m.lift * 60 %}
    
    {% set novo_sub = m.sub_probe_atual + 1 %}
    {% set novo_sub_sum = m.sub_sum_z + z %}
    
    # Subida rápida de retração entre toques
    G91
    G1 Z{m.retract} F{lift_feedrate}
    G90

    {% if novo_sub < m.probes_per_sample %}
        # Ainda faltam toques para completar a média desta amostra
        SET_GCODE_VARIABLE MACRO=TESTE_PROBE_ACCURACY VARIABLE=sub_probe_atual VALUE={novo_sub}
        SET_GCODE_VARIABLE MACRO=TESTE_PROBE_ACCURACY VARIABLE=sub_sum_z VALUE={novo_sub_sum}
        UPDATE_DELAYED_GCODE ID=_LOOP_PROBE_ACCURACY DURATION=0.05
    {% else %}
        # Amostra concluída: calcula a média das leituras deste ponto
        {% set sample_z = (novo_sub_sum / m.probes_per_sample|float) %}
        
        {% if sample_z < m.z_min %}
            SET_GCODE_VARIABLE MACRO=TESTE_PROBE_ACCURACY VARIABLE=z_min VALUE={sample_z}
        {% endif %}
        
        {% if sample_z > m.z_max %}
            SET_GCODE_VARIABLE MACRO=TESTE_PROBE_ACCURACY VARIABLE=z_max VALUE={sample_z}
        {% endif %}
        
        SET_GCODE_VARIABLE MACRO=TESTE_PROBE_ACCURACY VARIABLE=sum_z VALUE={m.sum_z + sample_z}
        SET_GCODE_VARIABLE MACRO=TESTE_PROBE_ACCURACY VARIABLE=sum_z2 VALUE={m.sum_z2 + (sample_z * sample_z)}
        SET_GCODE_VARIABLE MACRO=TESTE_PROBE_ACCURACY VARIABLE=amostra_atual VALUE={m.amostra_atual + 1}
        
        # Zera acumuladores para a próxima amostra
        SET_GCODE_VARIABLE MACRO=TESTE_PROBE_ACCURACY VARIABLE=sub_probe_atual VALUE=0
        SET_GCODE_VARIABLE MACRO=TESTE_PROBE_ACCURACY VARIABLE=sub_sum_z VALUE=0.0
        
        UPDATE_DELAYED_GCODE ID=_LOOP_PROBE_ACCURACY DURATION=0.05
    {% endif %}

[gcode_macro _CALCULA_PROBE_ACCURACY]
gcode:
    {% set m = printer["gcode_macro TESTE_PROBE_ACCURACY"] %}
    {% set n = m.amostras_max|float %}
    {% set range = (m.z_max - m.z_min)|round(6) %}
    {% set z_min = m.z_min|round(4) %}
    {% set z_max = m.z_max|round(4) %}
    
    # Cálculo de Média Geral e Desvio Padrão Amostral
    {% set avg = (m.sum_z / n) %}
    {% set variance = [(m.sum_z2 - (n * avg * avg)) / (n - 1.0), 0.0]|max if n > 1 else 0.0 %}
    {% set std_dev = (variance ** 0.5)|round(6) %}
    {% set avg_round = avg|round(4) %}
    
    G90
    G1 Z10 F1200
    
    {% if range <= 0.0150 %}
        {% set status_html = "<font color=green><b>ÓTIMO (Excelente)</b></font>" %}
        {% set status_popup = "ÓTIMO" %}
        {% set btn_style = "success" %}
    {% elif range <= 0.0300 %}
        {% set status_html = "<font color=yellow><b>ACEITÁVEL (Bom)</b></font>" %}
        {% set status_popup = "ACEITÁVEL" %}
        {% set btn_style = "warning" %}
    {% else %}
        {% set status_html = "<font color=red><b>RUIM (Instável)</b></font>" %}
        {% set status_popup = "RUIM" %}
        {% set btn_style = "error" %}
    {% endif %}
    
    M117 R:{range} SD:{std_dev} [{status_popup}]
    
    RESPOND MSG="========================================"
    RESPOND MSG="       RESULTADO DA ACURÁCIA DO PROBE   "
    RESPOND MSG="========================================"
    RESPOND MSG="Velocidade: {m.speed} mm/s | Amostras: {m.amostras_max} ({m.probes_per_sample} probes cada)"
    RESPOND MSG="Mínimo: {z_min} mm | Máximo: {z_max} mm"
    RESPOND MSG="Média: {avg_round} mm | Desvio Padrão: {std_dev} mm"
    RESPOND MSG="Range: {range} mm"
    RESPOND MSG="Classificação: {status_html}"
    RESPOND MSG="========================================"
    
    RESPOND TYPE=command MSG="action:prompt_begin Análise Estatística do Probe"
    RESPOND TYPE=command MSG="action:prompt_text Velocidade: {m.speed} mm/s — {m.amostras_max} amostras ({m.probes_per_sample} probes cada)"
    RESPOND TYPE=command MSG="action:prompt_text Range: {range} mm — Status: {status_popup}"
    RESPOND TYPE=command MSG="action:prompt_text Média: {avg_round} mm | Desvio Padrão: {std_dev} mm"
    RESPOND TYPE=command MSG="action:prompt_text Mínimo: {z_min} mm | Máximo: {z_max} mm"
    RESPOND TYPE=command MSG="action:prompt_footer_button FECHAR|RESPOND TYPE=command MSG=action:prompt_end|{btn_style}"
    RESPOND TYPE=command MSG="action:prompt_show"

