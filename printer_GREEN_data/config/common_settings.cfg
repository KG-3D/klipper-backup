[gcode_macro _EXECUTAR_PURGA]
description: Purga 10mm a 250C com resfriamento simultâneo, retração, corte e limpeza
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% if printer.extruder.temperature >= 195 %}
        {% set target_temp = 250 %}
        {% set drop_temp = (target_temp * 0.8)|int %}
        {% set safe_purge_speed = 150 %}
        {% set is_paused = printer.pause_resume.is_paused %}

        {% if not is_paused %}
            SAVE_GCODE_STATE NAME=prepurge_state
        {% endif %}

        G90
        G0 X-17 Y10 Z0.4 F6000
        M83
        
        # Carga do tubo até o bico
        G1 E75 F300
        
        # Dispara o resfriamento para 80% (200C) e liga o ar simultaneamente à purga
        M104 S{drop_temp}
        M106 S255
        
        # Purga estrita de 10mm engrossando o polímero
        G1 E10 F{safe_purge_speed}
        
        # Super vácuo com retração escalonada em duplo estágio contra oozing
        G1 E0.5 F300
        G1 E-3.0 F3600
        G1 E-6.0 F2400
        
        # Espera curta de consolidação baseada no alvo térmico reduzido
        TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={drop_temp + 2}
        
        # Corte seco na quina da chapa e acionamento da escova
        G1 X0 Y10 F9000
        LIMPEZA_NOZZLE_ESCOVA
        
        M106 S0

        {% if is_paused %}
            # Em pausa de impressão: reaquece para retomar o trabalho
            M104 S{target_temp}
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={target_temp - 2}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=unretract VALUE=9.0
            {action_respond_info("Purga concluída na mesa. Retomando impressão...")}
            RESUME
        {% else %}
            # Em troca manual: estabiliza a 150C em repouso contra oozing
            M104 S150
            RESTORE_GCODE_STATE NAME=prepurge_state
            {action_respond_info("Troca manual concluída. Bico mantido em repouso a 150°C.")}
        {% endif %}
    {% else %}
        {action_respond_info("Erro: Temperatura abaixo de 195C. Abortado por segurança.")}
    {% endif %}
    
[gcode_macro BED_THERMAL_SATURATION]
description: Expanda a seta ao lado para digitar a temperatura alvo (TARGET)
gcode:
    {% set target = params.TARGET|default(50)|float %}
    {% set overshoot = target + 10 %}
    {% set wait = 2 %}

    RESPOND MSG="Iniciando saturação térmica. Aquecendo para {overshoot}°C..."
    M190 S{overshoot}
    
    RESPOND MSG="Temperatura de pico atingida. Mantendo por {wait} minutos..."
    G4 P{wait * 60000}
    
    RESPOND MSG="Resfriando para a temperatura alvo de {target}°C..."
    M140 S{target}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={target} MAXIMUM={target + 1}
    
    RESPOND MSG="Temperatura alvo atingida. Estabilizando por {wait} minutos..."
    G4 P{wait * 60000}
    
    RESPOND MSG="Saturação térmica concluída!"

