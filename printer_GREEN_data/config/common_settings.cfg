[gcode_macro TESTE_VELOCIDADE_FISICA]
gcode:
    {% set V_INICIAL = params.V_INICIAL|default(200)|int %}      
    {% set V_FINAL = params.V_FINAL|default(240)|int %}
    {% set A_INICIAL = params.A_INICIAL|default(2500)|int %}    
    {% set A_FINAL = params.A_FINAL|default(4000)|int %}
    {% set PASSOS = params.PASSOS|default(4)|int %}              
    {% set SCV = params.SCV|default(15)|int %} 

    {% set X_MIN = 20 %}
    {% set X_MAX = 200 %}
    {% set Y_MIN = 20 %}
    {% set Y_MAX = 200 %}
    {% set X_MID = 110 %}
    {% set Y_MID = 110 %}
    {% set RAIO = 50 %} 

    {% set Z_START = 10.0 %}

    {% set passos_ajustados = PASSOS - 1 if PASSOS > 1 else 1 %}
    {% set V_INCREMENTO = (V_FINAL - V_INICIAL) / passos_ajustados %}
    {% set A_INCREMENTO = (A_FINAL - A_INICIAL) / passos_ajustados %}

    G28
    G90
    M83
    
    G1 Z{Z_START} F1200
    
    {% for i in range(PASSOS) %}
        {% set v_atual = (V_INICIAL + (i * V_INCREMENTO))|int %}
        {% set a_atual = (A_INICIAL + (i * A_INCREMENTO))|int %}
        {% set z_atual = Z_START + (i * 0.2) %}
        {% set f_atual = v_atual * 60 %} 

        M117 Z:{z_atual} V:{v_atual} A:{a_atual}
        RESPOND MSG="Andar {i+1}/{PASSOS}: Z={z_atual}mm | Vel={v_atual}mm/s | Accel={a_atual}mm/s² | SCV={SCV}"
        
        SET_VELOCITY_LIMIT VELOCITY={v_atual} ACCEL={a_atual} SQUARE_CORNER_VELOCITY={SCV}

        G1 Z{z_atual} F1200

        # --- PADRÃO 1: O "X" ---
        G1 X{X_MIN} Y{Y_MIN} F{f_atual}
        G1 X{X_MAX} Y{Y_MAX} F{f_atual}
        G1 X{X_MIN} Y{Y_MAX} F{f_atual}
        G1 X{X_MAX} Y{Y_MIN} F{f_atual}

        G1 X{X_MIN} Y{Y_MIN} F{f_atual}

        # --- PADRÃO 2: QUADRADO ---
        G1 X{X_MAX} Y{Y_MIN} F{f_atual}
        G1 X{X_MAX} Y{Y_MAX} F{f_atual}
        G1 X{X_MIN} Y{Y_MAX} F{f_atual}
        G1 X{X_MIN} Y{Y_MIN} F{f_atual}

        G1 X{X_MID + RAIO} Y{Y_MID} F{f_atual}

        # --- PADRÃO 3: CÍRCULO VIA ARCOS NATIVOS (G2) ---
        G2 X{X_MID - RAIO} Y{Y_MID} I-{RAIO} J0 F{f_atual}
        G2 X{X_MID + RAIO} Y{Y_MID} I{RAIO} J0 F{f_atual}

    {% endfor %}

    G1 Z{Z_START + (PASSOS * 0.2) + 5} F1200 
    G1 X0 Y220 F3000                         
    M117 Fim do Teste
    RESPOND MSG="Teste concluido com movimentos suavizados!"

[gcode_macro LIMPEZA_NOZZLE_ESCOVA]
gcode:
    {% set max_accel = printer.configfile.settings.printer.max_accel %}
    
    {% if "xyz" not in printer.toolhead.homed_axes %}
        M117 Fazendo homing...
        G28
    {% endif %}

    SET_VELOCITY_LIMIT ACCEL=3600
    M117 Limpando bico na escova...
    G90
    G1 Z10 F1200
    G1 X86 Y-21.8 F13200              ; Ponto Inicial: Anterior Direito (AD)
    G1 Z1 F1200
    # Faixa 1 (Mais Distante: Y-21.8)
    G1 X52 F13200                     ; Varre até Anterior Esquerdo (AE)
    G1 X66 F13200
    G1 X52 F13200
    G1 X66 F13200
    G1 X52 F13200
    # Faixa 2 (Intermediária Distante: Y-20.3)
    G1 Y-20.3 F13200
    G1 X86 F13200
    G1 X72 F13200
    G1 X86 F13200
    G1 X72 F13200
    G1 X86 F13200
    # Faixa 3 (Intermediária Próxima: Y-18.7)
    G1 Y-18.7 F13200
    G1 X52 F13200
    G1 X66 F13200
    G1 X52 F13200
    G1 X66 F13200
    G1 X52 F13200
    # Faixa 4 (Mais Perto: Y-17.2)
    G1 Y-17.2 F13200                  
    G1 X86 F13200                     ; Varre até Posterior Direito (PD)
    G1 X72 F13200
    G1 X86 F13200
    # --- Desengate Rápido e Saída ---
    G1 Y-14.0 F13200                  ; Afasta do bico para frente
    G1 X45 Z10 F13200                 ; Sobe e sai pela esquerda
    G4 P200
    SET_VELOCITY_LIMIT ACCEL={max_accel}
    M117 Limpeza concluída!

[gcode_macro TROCA_FILAMENTO]
description: Aquece a 250C, estaciona e aguarda o saque manual do filamento
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set target_temp = 250 %}
    {action_respond_info("Aquecendo para 250C...")}
    M104 S{target_temp}
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
    {% endif %}
    G90
    G1 Z10 F1500
    G1 X-17 Y10 Z0.4 F6000
    M109 S{target_temp}
    M83
    # Extrusão de 3mm para pressurizar e arredondar a ponta antes do saque
    G1 E3.0 F120
    
    # Bipes de alerta
    M300 P50
    G4 P100
    M300 P50
    
    # Notificação para liberação mecânica da alavanca e saque manual
    RESPOND TYPE=command MSG="action:prompt_begin Troca de Filamento"
    RESPOND TYPE=command MSG="action:prompt_text Pressione a alavanca da extrusora, puxe o filamento manualmente e insira o novo material."
    RESPOND TYPE=command MSG="action:prompt_footer_button CARREGAR E PURGAR 10MM|_EXECUTAR_PURGA|primary"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _PREPARA_E_EJETA]
