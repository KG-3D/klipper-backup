[delayed_gcode turn_off_probe_fan]
gcode:
    M107 ; Desliga a ventoinha em background apos 1 minuto

[pause_resume]
recover_velocity: 50.0

[gcode_macro M300]
description: Aciona o bipe pelo tempo P (em ms)
gcode:
    {% set P = params.P|default(100)|int %}
    SET_PIN PIN=beeper VALUE=1
    G4 P{P}
    SET_PIN PIN=beeper VALUE=0

[gcode_macro BEEP]
description: Alias para M300
gcode:
    {% set P = params.P|default(100)|int %}
    M300 P{P}

[gcode_macro PRINT_START]
gcode:
    {% set bed_temp = params.BED | default(50) | float %}
    {% set extruder_temp = params.EXTRUDER | default(220) | float %}
    {% set material = params.MATERIAL | default("PLA") | string %}
    TOOLHEAD_COLOR PRESET=5
    CLEAR_PAUSE
    G90
    
    ; --- 1. HOMING INICIAL E ESTACIONAMENTO FRIO ---
    M117 Homing inicial...
    G28
    G1 X-17 Y10 Z100 F3000
    M106 S255 ; Sonda resfriada a 100mm da mesa
    
    ; --- 2. AQUECIMENTO SIMULTÂNEO (MESA E BICO JUNTOS) ---
    M117 Aquecendo mesa e bico...
    M140 S{bed_temp}
    M104 S{extruder_temp}
    M190 S{bed_temp}
    M109 S{extruder_temp}
    
    ; --- ESTABILIZAÇÃO TÉRMICA DA MESA (3 min.) ---
    M117 Estabilizando mesa (3 min.)...
    G4 P180000 ; Aguarda 180 segundos para equalizacao termica da chapa PEI
    
    ; --- 3. LIMPEZA NA ESCOVA ---
    G92 E0
    G1 E-1.5 F2400
    G92 E0
    M117 Limpando bico...
    M107
    LIMPEZA_NOZZLE_ESCOVA
    
    ; --- 4. HOMING Z E MALHA ADAPTATIVA ---
    M106 S255
    M117 Homing Z...
    G28.1 Z ; Usa o homing nativo direto para não travar no script WLED
    M117 Malha Adaptativa...
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ADAPTIVE=1
    M107
    
    ; --- 5. VARIÁVEIS E INÍCIO DIRETO (SEM PAUSAS) ---
    _SELECIONAR_PA MATERIAL={material}
    _SELECIONAR_RETRACTION MATERIAL={material}
    _CARREGAR_IS
    M117 Purgando...
    ADAPTIVE_LINE_PURGE
    M117 Imprimindo...
    SET_GCODE_VARIABLE MACRO=WLED_STATE VARIABLE=printing VALUE=True
    TOOLHEAD_COLOR PRESET=2

[gcode_macro PAUSE]
description: Pausa a impressao e estaciona fora da mesa em X-17 Y10 Z0.4
rename_existing: BASE_PAUSE
variable_x: 0.0
variable_y: 0.0
variable_z: 0.0
variable_e: 0.0
gcode:
    # 1. Salva a posição exata de todos os eixos
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=x VALUE={printer.gcode_move.gcode_position.x}
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=y VALUE={printer.gcode_move.gcode_position.y}
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=z VALUE={printer.gcode_move.gcode_position.z}
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=e VALUE={printer.gcode_move.gcode_position.e}
    
    BASE_PAUSE
    
    # 2. Retrai ANTES de mover para não babar na peça
    G91
    {% if printer.extruder.can_extrude|lower == 'true' %}
        G1 E-2 F2700
    {% endif %}
    
    # 3. Calcula altura segura (+10mm) para sair de cima da peça
    {% set pz = printer.gcode_move.gcode_position.z | float %}
    {% set max_z = printer.toolhead.axis_maximum.z | float %}
    {% set z_safe = [pz + 10.0, max_z] | min %}

    # 4. Sobe Z, vai para fora da mesa na posição do corte e desce para Z0.4
    G90
    G1 Z{z_safe} F3000
    G1 X-17 Y10 F6000
    G1 Z0.4 F3000

[gcode_macro RESUME]
description: Corta a purga na borda da mesa, sobe e retoma a impressao
rename_existing: BASE_RESUME
variable_unretract: 2.0
gcode:
    UPDATE_DELAYED_GCODE ID=ALERT_BEEP_LOOP DURATION=0
    RESPOND TYPE=command MSG="action:prompt_end"
    
    {% set px = printer["gcode_macro PAUSE"].x | float %}
    {% set py = printer["gcode_macro PAUSE"].y | float %}
    {% set pz = printer["gcode_macro PAUSE"].z | float %}
    {% set pe = printer["gcode_macro PAUSE"].e | float %}
    
    {% set max_z = printer.toolhead.axis_maximum.z | float %}
    {% set z_safe = [pz + 10.0, max_z] | min %}
    
    G90
    # 1. Corte limpo: Movimento rápido contra a quina de aço em Z0.4
    G1 X0 Y10 F9000
    
    # 2. Sobe para altura segura para viajar sem colidir com a peça
    G1 Z{z_safe} F3000
    
    # 3. Viaja XY até a peça e desce Z isoladamente
    G1 X{px} Y{py} F6000
    G1 Z{pz} F3000
    
    # 4. Restaura a extrusão exata (2mm em pausas normais, 5mm na troca)
    M83
    G1 E{unretract} F2400
    
    # 5. Restaura referencial do extrusor e retoma
    G92 E{pe}
    BASE_RESUME
    
    # Reseta a variável para o padrão de pausas convencionais
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=unretract VALUE=2.0

[gcode_macro CANCEL_PRINT]
description: Cancela a impressao atual, encerra bipes e preserva offsets
rename_existing: CANCEL_PRINT_BASE
gcode:
    UPDATE_DELAYED_GCODE ID=ALERT_BEEP_LOOP DURATION=0
    RESPOND TYPE=command MSG="action:prompt_end"
    SET_GCODE_VARIABLE MACRO=WLED_STATE VARIABLE=printing VALUE=False
    TOOLHEAD_COLOR PRESET=1
    
    {% if printer.extruder.can_extrude|lower == 'true' %}
        G91
        G1 E-3 F2400
        G90
    {% endif %}
    
    TURN_OFF_HEATERS
    M106 S0
    
    {% set current_z = printer.toolhead.position.z | float %}
    {% set max_z = printer.toolhead.axis_maximum.z | float %}
    {% set pause_z = printer["gcode_macro PAUSE"].z | default(0.0) | float %}
    {% set base_z = [current_z, pause_z] | max %}
    {% if base_z < 90.0 %}
        {% set target_z = 100.0 %}
    {% else %}
        {% set target_z = base_z + 10.0 %}
    {% endif %}
    {% if target_z > max_z %}
        {% set target_z = max_z %}
    {% endif %}
    
    G90
    G1 Z{target_z} F3000
    G1 X-12 Y200 F6000
    
    M84 X Y E
    SET_PAUSE_NEXT_LAYER ENABLE=0
    SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
    CANCEL_PRINT_BASE
    
[gcode_macro PRINT_END]
gcode:
    UPDATE_DELAYED_GCODE ID=ALERT_BEEP_LOOP DURATION=0
    SET_GCODE_VARIABLE MACRO=WLED_STATE VARIABLE=printing VALUE=False
    
    ; 1. Recuo imediato
    G91
    G1 E-2 F2700
    G1 Z0.2 F2400
    G90
    
    ; 2. Cálculo do Z em movimento único
    {% set current_z = printer.toolhead.position.z|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% if current_z < 90.0 %}
        {% set target_z = 100.0 %}
    {% else %}
        {% set target_z = current_z + 10.0 %}
    {% endif %}
    {% if target_z > max_z %}
        {% set target_z = max_z %}
    {% endif %}
    
    ; 3. Movimentos físicos (executados com motores ativos)
    G1 Z{target_z} F3000
    G1 X-12 Y200 F6000
    
    ; 4. Desliga aquecedores
    M104 S0
    M140 S0
    
    ; 5. Resfriamento da sonda por 60s em background
    M106 S255
    UPDATE_DELAYED_GCODE ID=turn_off_probe_fan DURATION=60
    
    ; 6. Desliga motores mantendo o offset na memória volátil
    M84 X Y E
    TOOLHEAD_COLOR PRESET=1

[gcode_macro SALVAR_BABYSTEP]
description: Salva o Z-Offset na probe
gcode:
    Z_OFFSET_APPLY_PROBE
    SAVE_CONFIG

[gcode_macro M600]
description: Atalho nativo para interceptar o comando M600 do fatiador durante a impressão
gcode:
    PAUSE
    TROCA_FILAMENTO

[gcode_macro PARAR_BIPES]
description: Para o bipe pelo botao do popup
gcode:
    UPDATE_DELAYED_GCODE ID=ALERT_BEEP_LOOP DURATION=0

[gcode_macro RETOMAR_IMPRESSAO]
description: Carrega filamento, purga 10mm resfriando, retrai pesadamente e retoma
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    UPDATE_DELAYED_GCODE ID=ALERT_BEEP_LOOP DURATION=0
    
    {% set target_temp = 250.0 %}
    {% set drop_temp = (target_temp * 0.8)|int %}
    
    G90
    G1 X-17 Y10 Z0.4 F6000
    
    M83
    # Puxa o filamento novo até o bico
    G1 E75 F300
    
    # Inicia a queda térmica e liga o ar JUNTO com a purga
    M104 S{drop_temp}
    M106 S255
    
    # Purga manual (exatos 10mm em 150mm/min = 2.5mm/s)
    G1 E10 F150      
    
    # Wipe-in-place e mega retração compensatória contra oozing
    G1 E0.5 F300
    G1 E-3.0 F3600
    G1 E-6.0 F2400
    
    # Espera rápida de 5s para consolidação térmica
    G4 P5000       
    
    # Restaura temperatura universal da troca
    M104 S{target_temp}
    
    # Informa ao RESUME que foram tirados 9.0mm (3 + 6)
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=unretract VALUE=9.0
    RESUME

[delayed_gcode ALERT_BEEP_LOOP]
gcode:
    M300 P100
    UPDATE_DELAYED_GCODE ID=ALERT_BEEP_LOOP DURATION=10

[gcode_macro LINE_PURGE]
gcode:
    G92 E0                       
    G1 Z2 F3000                  
    G1 X20 Y40 Z0.4 F5000         
    G1 X20 Y185 Z0.4 E15 F1500    
    G1 X20.4 Y185 Z0.4 F5000      
    G1 X0.4 Y0 Z0.4 E30 F1500    
    G92 E0                       
    G1 E-1 F1800                 
    G0 Z2 F3000                  
    G1 E0 F1800                  

[gcode_macro ADAPTIVE_LINE_PURGE]
variable_purge_height: 0.8  
variable_tip_distance: 4     
variable_purge_margin: 20    
variable_purge_amount: 20    
variable_flow_rate: 12       
gcode:
    {% set travel_speed = printer.toolhead.max_velocity * 60 %}
    {% set wipe_speed = 3000 %}
    {% set cross_section = printer.configfile.settings.extruder.max_extrude_cross_section | float %}
    
    {% set RETRACT = 'G10' if printer.firmware_retraction is defined else 'G1 E-0.5 F2100' %}
    {% set UNRETRACT = 'G11' if printer.firmware_retraction is defined else 'G1 E0.5 F2100' %}

    {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}    
    {% set x_min = (all_points | map(attribute=0) | min | default(0)) %}                                
    {% set x_max = (all_points | map(attribute=0) | max | default(0)) %}                                
    {% set y_min = (all_points | map(attribute=1) | min | default(0)) %}                                
    {% set y_max = (all_points | map(attribute=1) | max | default(0)) %}                                
    
    {% set x_center = ([((x_max + x_min) / 2) - (purge_amount / 2), 0] | max) %}                        
    {% set y_center = ([((y_max + y_min) / 2) - (purge_amount / 2), 0] | max) %}                        

    {% set x_origin = ([x_min - purge_margin, 5] | max) %}                                              
    {% set y_origin = ([y_min - purge_margin, 5] | max) %}                                              

    {% set purge_move_speed = (flow_rate / 5.0) * 60 | float %}

    {% if cross_section < 5 %}
        {action_respond_info("[Extruder] max_extrude_cross_section is insufficient for purge. Set it to 5 or greater. Purge skipped.")}
    {% else %}
        SAVE_GCODE_STATE NAME=prepurge_state                                                             

        G92 E0                                                                                           
        G0 F{travel_speed}                                                                               
        G90                                                                                              
        G0 X{x_origin if x_origin > 0 else x_center} Y{y_center if x_origin > 0 else y_origin}   
        G0 Z{purge_height}                                                                               
        M83                                                                                              
        G1 E{tip_distance} F{purge_move_speed}                                                           

        {% if x_origin > 0 %}                                                                            
            G1 Y{y_center + purge_amount} E{purge_amount} F{purge_move_speed}                    
            {RETRACT}                                                                                   
            G0 Y{y_center + purge_amount + 10} F{wipe_speed}
        {% else %}                                                                                       
            G1 X{x_center + purge_amount} E{purge_amount} F{purge_move_speed}                    
            {RETRACT}                                                                                    
            G0 X{x_center + purge_amount + 10} F{wipe_speed}
        {% endif %}
        
        G0 Z{purge_height * 2} F{travel_speed}                                                           
        {UNRETRACT}                                                                                      
        G92 E0                                                                                           
        M82                                                                                              

        RESTORE_GCODE_STATE NAME=prepurge_state                                                          
    {% endif %}

[gcode_macro LOAD_FILAMENT]
variable_load_distance: 40      
variable_purge_distance: 30     
gcode:
    {% set load_speed = params.LOAD_SPEED | default(1500) | float %}
    {% set purge_speed = params.PURGE_SPEED | default(300) | float %}
    {% set min_temp = params.MIN_TEMP | default(220) | float %}
    {% set turn_off_extruder = params.TURN_OFF_EXTRUDER | default(1) | int %}   
    
    SAVE_GCODE_STATE NAME=load_state     

    {% if printer.extruder.temperature < min_temp %}
        M109 S{min_temp} 
    {% endif %}

    G91                                  
    G92 E0                               
    G1 E{load_distance} F{load_speed}    
    G1 E{purge_distance} F{purge_speed}  

    {% if turn_off_extruder %}
        M104 S0 
    {% endif %}

    RESTORE_GCODE_STATE NAME=load_state  
    M118 Filament Loaded                 

[gcode_macro UNLOAD_FILAMENT]
variable_unload_distance: 80     
variable_purge_distance: 20      
gcode:
    {% set unload_speed = params.UNLOAD_SPEED | default(1500) | float %}
    {% set purge_speed = params.PURGE_SPEED | default(300) | float %}
    {% set min_temp = params.MIN_TEMP | default(220) | float %}
    {% set turn_off_extruder = params.TURN_OFF_EXTRUDER | default(1) | int %}   

    SAVE_GCODE_STATE NAME=unload_state  

    {% if printer.extruder.temperature < min_temp %}
        M109 S{min_temp} 
    {% endif %}

    G91                                      
    G92 E0                                   
    G1 E{purge_distance} F{purge_speed}      
    G1 E-{unload_distance} F{unload_speed}   

    {% if turn_off_extruder %}
        M104 S0 
    {% endif %}

    RESTORE_GCODE_STATE NAME=unload_state    
    M118 Filament Unloaded                   

[gcode_macro OFF]
gcode:
    {% if printer.pause_resume.is_paused %}
        M104 S0 ; Desliga só o bico na pausa, mantendo mesa e motores ativos
        {action_respond_info("Timeout em pausa: Bico desligado, mesa e motores mantidos!")}
    {% else %}
        M84
        TURN_OFF_HEATERS
        M107
    {% endif %}

[gcode_macro PID_EXTRUDER]
gcode:
    {% set target = params.TARGET|default(220)|float %}
    M106 S255 ; Liga a ventoinha em 100% para simular o fluxo de ar
    PID_CALIBRATE HEATER=extruder TARGET={target}
    M107
    SAVE_CONFIG

[gcode_macro PID_BED]
gcode:
    {% set target = params.TARGET|default(60)|float %}
    PID_CALIBRATE HEATER=heater_bed TARGET={target} WRITE_FILE=1
    SAVE_CONFIG

[gcode_macro M190]
rename_existing: M99190
gcode:
    {% set s = params.S | float %}
    M140 {% for p in params %} {'%s%s' % (p, params[p])} {% endfor %}   
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s}
    {% endif %}

[gcode_macro SALVAR_CONFIGURACAO]
description: Salva as alteracoes atuais e reinicia o Klipper
gcode:
    SAVE_CONFIG

[gcode_macro SALVAR_BABYSTEP]
description: Salva o Z-Offset na probe descontando compensacoes temporarias de ABS/PETG
gcode:
    {% set ps = printer["gcode_macro PRINT_START"] %}
    {% if ps.abs_offset_applied or ps.petg_offset_applied %}
        {action_respond_info("Compensação de ABS/PETG (-0.100mm) detectada! Removendo antes de gravar no sensor...")}
        SET_GCODE_OFFSET Z_ADJUST=0.100
        SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=abs_offset_applied VALUE=False
        SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=petg_offset_applied VALUE=False
    {% endif %}
    Z_OFFSET_APPLY_PROBE
    SAVE_CONFIG

[gcode_macro STATUS_PERFIL]
description: Exibe um popup com o resumo de PA, Retracao, Input Shaper e Z-Offset ativos
gcode:
    {% set pa = printer.extruder.pressure_advance | round(4) %}
    {% set st = printer.extruder.smooth_time | round(3) %}
    {% set rl = printer.firmware_retraction.retract_length | round(2) %}
    {% set rs = printer.firmware_retraction.retract_speed | round(1) %}
    {% set z_off = printer.gcode_move.homing_origin.z | round(3) %}
    {% set is_m = printer["gcode_macro SET_INPUT_SHAPER_FREQ"] %}

    RESPOND TYPE=command MSG="action:prompt_begin Status do Perfil Ativo (0.4mm)"
    RESPOND TYPE=command MSG="action:prompt_text Pressure Advance: {pa} (Smooth: {st}s)"
    RESPOND TYPE=command MSG="action:prompt_text Retração Firmware: {rl}mm @ {rs}mm/s"
    RESPOND TYPE=command MSG="action:prompt_text Input Shaper X: {is_m.last_freq_x}Hz ({is_m.last_type_x}) | Y: {is_m.last_freq_y}Hz ({is_m.last_type_y})"
    RESPOND TYPE=command MSG="action:prompt_text G-Code Z-Offset Atual: {z_off}mm"
    RESPOND TYPE=command MSG="action:prompt_footer_button FECHAR|RESPOND TYPE=command MSG=action:prompt_end|primary"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro TESTE_RANGE_PARAFUSOS]
description: Testa os 4 parafusos com mesa aquecida e exibe resumo de 4 classes
variable_coords_x: [50, 200, 200, 50]
variable_coords_y: [45, 45, 200, 200]
variable_nomes: ["Frontal Esquerdo", "Frontal Direito", "Traseiro Direito", "Traseiro Esquerdo"]
variable_ponto_atual: 0
variable_amostras_max: 10
variable_amostra_atual: 0
variable_z_min: 999.0
variable_z_max: -999.0
variable_r0: ""
variable_r1: ""
variable_r2: ""
variable_r3: ""
gcode:
    RESPOND MSG="Aquecendo a mesa a 50°C..."
    M190 S50
    
    {% if not 'xyz' in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    SET_GCODE_VARIABLE MACRO=TESTE_RANGE_PARAFUSOS VARIABLE=ponto_atual VALUE=0
    _TESTE_MOVE_PONTO

[gcode_macro _TESTE_MOVE_PONTO]
gcode:
    {% set m = printer["gcode_macro TESTE_RANGE_PARAFUSOS"] %}
    {% if m.ponto_atual < 4 %}
        {% set x = m.coords_x[m.ponto_atual] %}
        {% set y = m.coords_y[m.ponto_atual] %}
        {% set nome = m.nomes[m.ponto_atual] %}
        
        RESPOND MSG="Iniciando leituras: {nome}"
        G90
        G1 Z10 F1200
        G1 X{x} Y{y} F13200
        
        SET_GCODE_VARIABLE MACRO=TESTE_RANGE_PARAFUSOS VARIABLE=amostra_atual VALUE=0
        SET_GCODE_VARIABLE MACRO=TESTE_RANGE_PARAFUSOS VARIABLE=z_min VALUE=999.0
        SET_GCODE_VARIABLE MACRO=TESTE_RANGE_PARAFUSOS VARIABLE=z_max VALUE=-999.0
        
        UPDATE_DELAYED_GCODE ID=_LOOP_PROBE DURATION=0.1
    {% else %}
        G91
        G1 Z10 F1200
        G90
        
        RESPOND MSG="========== RESUMO FINAL =========="
        RESPOND MSG="{m.r0}"
        RESPOND MSG="{m.r1}"
        RESPOND MSG="{m.r2}"
        RESPOND MSG="{m.r3}"
        RESPOND MSG="=================================="
    {% endif %}

[delayed_gcode _LOOP_PROBE]
gcode:
    {% set m = printer["gcode_macro TESTE_RANGE_PARAFUSOS"] %}
    {% if m.amostra_atual < m.amostras_max %}
        G90
        G1 Z10 F1200
        PROBE
        UPDATE_DELAYED_GCODE ID=_REGISTRA_PROBE DURATION=0.1
    {% else %}
        _TESTE_CALCULA
    {% endif %}

[delayed_gcode _REGISTRA_PROBE]
gcode:
    {% set m = printer["gcode_macro TESTE_RANGE_PARAFUSOS"] %}
    {% set z = printer.probe.last_z_result %}
    
    {% if z < m.z_min %}
        SET_GCODE_VARIABLE MACRO=TESTE_RANGE_PARAFUSOS VARIABLE=z_min VALUE={z}
    {% endif %}
    
    {% if z > m.z_max %}
        SET_GCODE_VARIABLE MACRO=TESTE_RANGE_PARAFUSOS VARIABLE=z_max VALUE={z}
    {% endif %}
    
    SET_GCODE_VARIABLE MACRO=TESTE_RANGE_PARAFUSOS VARIABLE=amostra_atual VALUE={m.amostra_atual + 1}
    UPDATE_DELAYED_GCODE ID=_LOOP_PROBE DURATION=0.1

[gcode_macro _TESTE_CALCULA]
gcode:
    {% set m = printer["gcode_macro TESTE_RANGE_PARAFUSOS"] %}
    {% set range = (m.z_max - m.z_min)|round(4) %}
    {% set nome = m.nomes[m.ponto_atual] %}
    
    {% if range <= 0.010 %}
        {% set status = "<font color=green>ÓTIMO</font>" %}
    {% elif range <= 0.025 %}
        {% set status = "<font color=yellow>BOM</font>" %}
    {% elif range <= 0.050 %}
        {% set status = "<font color=orange>MEDIANO</font>" %}
    {% else %}
        {% set status = "<font color=red>RUIM</font>" %}
    {% endif %}
    
    {% set texto_resultado = nome ~ ": " ~ range ~ "mm - Status: " ~ status %}
    
    {% if m.ponto_atual == 0 %}
        SET_GCODE_VARIABLE MACRO=TESTE_RANGE_PARAFUSOS VARIABLE=r0 VALUE="'{texto_resultado}'"
    {% elif m.ponto_atual == 1 %}
        SET_GCODE_VARIABLE MACRO=TESTE_RANGE_PARAFUSOS VARIABLE=r1 VALUE="'{texto_resultado}'"
    {% elif m.ponto_atual == 2 %}
        SET_GCODE_VARIABLE MACRO=TESTE_RANGE_PARAFUSOS VARIABLE=r2 VALUE="'{texto_resultado}'"
    {% elif m.ponto_atual == 3 %}
        SET_GCODE_VARIABLE MACRO=TESTE_RANGE_PARAFUSOS VARIABLE=r3 VALUE="'{texto_resultado}'"
    {% endif %}
    
    M117 {nome}: {range}
    
    SET_GCODE_VARIABLE MACRO=TESTE_RANGE_PARAFUSOS VARIABLE=ponto_atual VALUE={m.ponto_atual + 1}
    _TESTE_MOVE_PONTO

[gcode_macro ALINHAR_PARAFUSOS]
description: Aquece a mesa, faz o home de todos os eixos e inicia o cálculo dos parafusos.
gcode:
