[include fluidd.cfg]

[screws_tilt_adjust]
screw1: 50, 45
screw1_name: frontal esquerdo
screw2: 195, 45
screw2_name: frontal direito
screw3: 195, 200
screw3_name: traseiro direito
screw4: 50, 200
screw4_name: traseiro esquerdo
horizontal_move_z: 10
speed: 220
screw_thread: CW-M4

[bed_mesh]
speed: 200
mesh_min: 5,5
mesh_max: 191,191
zero_reference_position: 110, 110
probe_count: 7, 7
algorithm: bicubic
mesh_pps: 2, 2
bicubic_tension: 0.2
fade_start: 1.0
fade_end: 10.0
horizontal_move_z: 2.0

[probe]
pin: ^!PC15
x_offset: -24.5
y_offset: -23.0
#z_offset: 0.0
speed: 12.0
lift_speed: 20.0
sample_retract_dist: 2
samples: 2
samples_tolerance: 0.02
samples_tolerance_retries: 4

[respond]

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[printer]
kinematics: cartesian
max_velocity: 240
max_accel: 3600
minimum_cruise_ratio: 0.5
square_corner_velocity: 5.0
max_z_velocity: 16
max_z_accel: 200

[stepper_x]
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA5
position_endstop: -18   # (-6 - 12)
position_min: -18       # (-6 - 12)
position_max: 220       
homing_speed: 80

[tmc2209 stepper_x]
uart_pin: PB12
run_current: 0.6
sense_resistor: 0.150
stealthchop_threshold: 0
interpolate: True

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 39.91 # KG3D mod.
endstop_pin: !PA6
position_endstop: -22   # (-14 - 8)
position_min: -22       # (-14 - 8)
position_max: 220
homing_speed: 80

[tmc2209 stepper_y]
uart_pin: PB13
run_current: 0.6
sense_resistor: 0.150
stealthchop_threshold: 0
interpolate: True

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -3
position_max: 250
homing_speed: 12.0
second_homing_speed: 4.0
homing_retract_dist: 2.0

[tmc2209 stepper_z]
uart_pin: PB14
run_current: 0.8
sense_resistor: 0.150
stealthchop_threshold: 0
interpolate: True

[heater_bed]
heater_pin: PB2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
min_temp: 0
max_temp: 100

[heater_fan hotend_fan]
pin: PC1

[fan]
pin: PA0
kick_start_time: 0.1

[idle_timeout]
gcode: OFF
timeout: 1800

[safe_z_home]
home_xy_position: 139, 127
speed: 200
z_hop: 10
z_hop_speed: 10

[output_pin beeper]
pin: PB0

[gcode_arcs]

[exclude_object]

[firmware_retraction]
retract_length: 0.8
retract_speed: 40
unretract_extra_length: 0
unretract_speed: 40

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 35.5
damping_ratio_x: 0.1
shaper_type_y: mzv
shaper_freq_y: 46.5
damping_ratio_y: 0.1

