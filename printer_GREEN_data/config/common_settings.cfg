gcode:
    {% set s = params.S|default(0)|float %}
    {% set is_printing = printer['gcode_macro WLED_STATE'].printing %}
    
    M104.1 {rawparams}
    
    {% if not is_printing %}
        {% if s == 0 %}
            TOOLHEAD_COLOR PRESET=1
            UPDATE_DELAYED_GCODE ID=monitorar_aquecimento_bico DURATION=0
        {% else %}
            TOOLHEAD_COLOR PRESET=5
            UPDATE_DELAYED_GCODE ID=monitorar_aquecimento_bico DURATION=2
        {% endif %}
    {% endif %}

[delayed_gcode monitorar_aquecimento_bico]
gcode:
    {% set target = printer.extruder.target|float %}
    {% set atual = printer.extruder.temperature|float %}
    {% set is_printing = printer['gcode_macro WLED_STATE'].printing %}
    
    {% if is_printing %}
        UPDATE_DELAYED_GCODE ID=monitorar_aquecimento_bico DURATION=0
    {% else %}
        {% if target > 0 and atual >= target %}
            TOOLHEAD_COLOR PRESET=6
            UPDATE_DELAYED_GCODE ID=monitorar_aquecimento_bico DURATION=0
        {% elif target > 0 %}
            UPDATE_DELAYED_GCODE ID=monitorar_aquecimento_bico DURATION=2
        {% endif %}
    {% endif %}

[gcode_macro M109]
rename_existing: M99109
gcode:
    {% set s = params.S|default(0)|float %}
    {% set is_printing = printer['gcode_macro WLED_STATE'].printing %}
    
    {% if not is_printing and s > 0 %}
        TOOLHEAD_COLOR PRESET=5
    {% endif %}
    
    M104 {% for p in params %} {'%s%s' % (p, params[p])} {% endfor %}
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s} MAXIMUM={s+1}
    {% endif %}
    
    {% if not is_printing and s > 0 %}
        TOOLHEAD_COLOR PRESET=6
    {% endif %}

