[gcode_macro SECAR_PLA]
description: Inicia a secagem com contador no popup
variable_minutos: 0
variable_total_minutos: 0
variable_temp: 50
gcode:
    {% set temp = params.TEMP|default(50)|int %}
    {% set horas = params.HORAS|default(4)|int %}
    {% set total = horas * 60 %}

    SET_GCODE_VARIABLE MACRO=SECAR_PLA VARIABLE=temp VALUE={temp}
    SET_GCODE_VARIABLE MACRO=SECAR_PLA VARIABLE=minutos VALUE=0
    SET_GCODE_VARIABLE MACRO=SECAR_PLA VARIABLE=total_minutos VALUE={total}

    SET_IDLE_TIMEOUT TIMEOUT={horas * 3600 + 600}
    M140 S{temp}

    RESPOND TYPE=command MSG="action:prompt_begin Secagem de PLA em Andamento"
    RESPOND TYPE=command MSG="action:prompt_text Mesa a {temp}°C"
    RESPOND TYPE=command MSG="action:prompt_text Decorrido: 0 min | Total: {total} min"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Desligar Aquecimento|PARAR_SECAGEM|error"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_show"

    UPDATE_DELAYED_GCODE ID=LOOP_SECAGEM DURATION=60

[delayed_gcode LOOP_SECAGEM]
gcode:
    {% set macro = printer['gcode_macro SECAR_PLA'] %}
    {% set novo_minuto = macro.minutos + 1 %}
    SET_GCODE_VARIABLE MACRO=SECAR_PLA VARIABLE=minutos VALUE={novo_minuto}

    {% if novo_minuto >= macro.total_minutos %}
        PARAR_SECAGEM
        RESPOND MSG="Secagem concluida! Tempo total atingido."
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_begin Secagem de PLA em Andamento"
        RESPOND TYPE=command MSG="action:prompt_text Mesa a {macro.temp}°C"
        RESPOND TYPE=command MSG="action:prompt_text Decorrido: {novo_minuto} min | Restante: {macro.total_minutos - novo_minuto} min"
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button Desligar Aquecimento|PARAR_SECAGEM|error"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_show"

        UPDATE_DELAYED_GCODE ID=LOOP_SECAGEM DURATION=60
    {% endif %}

[gcode_macro PARAR_SECAGEM]
