[gcode_macro _SELECIONAR_PA]
description: Seleciona o PA e Smooth Time para nozzle 0.4mm conforme o Material
gcode:
    {% set material = params.MATERIAL|default("pla")|lower %}
    {% set svv = printer.save_variables.variables %}
    
    # 1. Busca PA específico por material ou recorre ao padrão
    {% set var_name = "pa_" ~ material ~ "_04" %}
    {% if var_name in svv %}
        {% set pa = svv[var_name] | float %}
    {% else %}
        {% set pa = svv.pa_pla_04 | default(0.04) | float %}
    {% endif %}

    # 2. Busca Smooth Time específico (st_<material>_04) ou o saved_st global
    {% set st_var_name = "st_" ~ material ~ "_04" %}
    {% if st_var_name in svv %}
        {% set st = svv[st_var_name] | float %}
    {% else %}
        {% set st = svv.saved_st | default(0.020) | float %}
    {% endif %}

    # 3. Aplica ambos simultaneamente no extrusor
    SET_PRESSURE_ADVANCE ADVANCE={pa} SMOOTH_TIME={st}
    RESPOND MSG="[Extrusor 0.4mm] Material: {material|upper} | PA: {pa} | Smooth Time: {st}s"

[gcode_macro _SELECIONAR_RETRACTION]
description: Seleciona a retracao para nozzle 0.4mm conforme o Material
gcode:
    {% set material = params.MATERIAL|default("pla")|lower %}
    {% set svv = printer.save_variables.variables %}

    {% set len_var = "retract_len_" ~ material ~ "_04" %}
    {% set spd_var = "retract_spd_" ~ material ~ "_04" %}

    {% set length = svv[len_var] | float if len_var in svv else (svv.saved_retract_length | default(0.4) | float) %}
    {% set speed  = svv[spd_var] | float if spd_var in svv else (svv.saved_retract_speed | default(50.0) | float) %}
    {% set uel = svv.saved_unretract_extra | default(0.0) | float %}
    {% set us  = svv.saved_unretract_speed | default(50.0) | float %}

    SET_RETRACTION RETRACT_LENGTH={length} RETRACT_SPEED={speed} UNRETRACT_EXTRA_LENGTH={uel} UNRETRACT_SPEED={us}
    RESPOND MSG="[Retração Auto 0.4mm] Chave: {len_var} | Len: {length}mm @ {speed}mm/s | Unretract: {us}mm/s"

