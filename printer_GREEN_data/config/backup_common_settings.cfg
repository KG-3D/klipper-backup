[include fluidd.cfg]

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[printer]
kinematics: cartesian
max_velocity: 240
max_accel: 4000
minimum_cruise_ratio: 0.5
square_corner_velocity: 5.0
max_z_velocity: 100
max_z_accel: 500

[stepper_x]
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA5
position_endstop: -18   # (-6 - 12)
position_min: -18       # (-6 - 12)
position_max: 230       
homing_speed: 80

[tmc2209 stepper_x]
uart_pin: PB12
run_current: 0.6
sense_resistor: 0.150
stealthchop_threshold: 0
interpolate: True

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 39.91 # KG3D mod.
endstop_pin: !PA6
position_endstop: -22   # (-14 - 8)
position_min: -22       # (-14 - 8)
position_max: 220
homing_speed: 80

[tmc2209 stepper_y]
uart_pin: PB13
run_current: 0.6
sense_resistor: 0.150
stealthchop_threshold: 0
interpolate: True

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -3
position_max: 250
homing_speed: 5
second_homing_speed: 1
homing_retract_dist: 2.5

[tmc2209 stepper_z]
uart_pin: PB14
run_current: 0.8
sense_resistor: 0.150
stealthchop_threshold: 0
interpolate: True

[extruder]
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
rotation_distance: 7.400
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_cross_section: 5
max_extrude_only_distance: 500
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: 0
max_temp: 260

[heater_bed]
heater_pin: PB2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
min_temp: 0
max_temp: 100

[screws_tilt_adjust]
screw1: 50, 45
screw1_name: frontal esquerdo
screw2: 195, 45
screw2_name: frontal direito
screw3: 195, 200
screw3_name: traseiro direito
screw4: 50, 200
screw4_name: traseiro esquerdo
horizontal_move_z: 10
speed: 220
screw_thread: CW-M4

[bed_mesh]
speed: 120
mesh_min: 20,20
mesh_max: 190,190
probe_count: 9,9
algorithm: bicubic
mesh_pps: 4, 4
bicubic_tension: 0.2
fade_start: 1.0
fade_end: 10.0

[bltouch]
sensor_pin: ^PC14
control_pin: PC13
stow_on_each_sample: False
probe_with_touch_mode: True
x_offset: -24.0
y_offset: -14.5
speed: 4
samples: 2
lift_speed: 12
samples_tolerance: 0.02
samples_tolerance_retries: 3

[heater_fan hotend_fan]
pin: PC1

[fan]
pin: PA0

[idle_timeout]
gcode: OFF
timeout: 600

[safe_z_home]
home_xy_position: 139, 127
speed: 150
z_hop: 10
z_hop_speed: 30

[output_pin beeper]
pin: PB0

[gcode_arcs]

[exclude_object]

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
    ##### get user parameters or use default #####
    {% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
    {% set retract = client.cancel_retract | default(5.0) | abs %}
    
    # restore idle_timeout time if needed
    {% if printer['gcode_macro RESUME'].restore_idle_timeout > 0 %}
      SET_IDLE_TIMEOUT TIMEOUT={printer['gcode_macro RESUME'].restore_idle_timeout}
    {% endif %}

    # 1. Retração de segurança do filamento
    _CLIENT_RETRACT LENGTH={retract}
    
    # 2. Desliga aquecedores e coolers
    TURN_OFF_HEATERS
    M106 S0

    # 3. Movimentação de Segurança Solicitada
    G91             ; Modo relativo (para mover Z com base na posição atual)
    G1 Z10 F1200    ; Eleva o bico em 10mm do ponto onde parou
    G90             ; Retorna para modo absoluto
    G1 X20 Y210 F6000 ; Move a ferramenta para a posição X20 Y20 (mantendo o Z elevado)

    # Limpezas padrão do Klipper
    {client.user_cancel_macro | default("")}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
    
    # clear pause_next_layer and pause_at_layer as preparation for next print
    SET_PAUSE_NEXT_LAYER ENABLE=0
    SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
    CANCEL_PRINT_BASE

[gcode_macro M300]
gcode:
    {% set P = params.P|default(100)|int %}
    SET_PIN PIN=beeper VALUE=1
    G4 P{P}
    SET_PIN PIN=beeper VALUE=0

[firmware_retraction]
retract_length: 0.8
retract_speed: 40
unretract_extra_length: 0
unretract_speed: 40

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 35.5
damping_ratio_x: 0.064
shaper_type_y: mzv
shaper_freq_y: 46.5
damping_ratio_y: 0.064

